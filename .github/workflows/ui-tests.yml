name: UI tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily production health check (see the prod-smoke job) — independent of
    # the main suite, needs no staging deployment or secrets to be useful.
    - cron: "0 6 * * *"

jobs:
  # Always runs, needs no app and no secrets: a PR that breaks compilation is
  # the one failure this repo can catch entirely on its own, and it would
  # otherwise go unnoticed whenever the suite job below is skipped.
  build:
    name: Compile suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile tests
        run: ./mvnw -B test-compile

      - name: Flag that the UI suite has no target configured
        if: vars.FG_BASE_URL == ''
        run: |
          echo "::warning title=UI suite skipped::The FG_BASE_URL repository variable is not set, so the smoke/regression/auth job did not run. Point it at a staging deployment to enable it — see README 'CI'."

  ui-tests:
    name: Smoke + Regression + Auth
    runs-on: ubuntu-latest
    # Needs the FomoGrab app (frontend + backend) reachable at FG_BASE_URL, so
    # the job is skipped unless that repo variable is set. It used to run
    # regardless, against a localhost with no app on it inside the runner, and
    # every push produced the same ~30 ERR_CONNECTION_REFUSED failures — noise
    # that trains people to ignore a red check. A skipped job says "not
    # configured" honestly; the build job above still warns about it on every run.
    if: vars.FG_BASE_URL != ''
    env:
      FG_BASE_URL: ${{ vars.FG_BASE_URL }}
      # Backend origin for the auth group's HTTP-minted session (see README
      # "Signing in without the login form"). Must be the same API the frontend
      # at FG_BASE_URL is built against, or the session cookie is minted for the
      # wrong host and auth tests fail as though the account were bad.
      FG_API_URL: ${{ vars.FG_API_URL }}
      FG_TEST_USER_EMAIL: ${{ secrets.FG_TEST_USER_EMAIL }}
      FG_TEST_USER_PASSWORD: ${{ secrets.FG_TEST_USER_PASSWORD }}
      FG_HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pom.xml') }}

      - name: Install Playwright browsers
        run: ./mvnw -B exec:java@install-browsers

      - name: Run smoke + regression + auth
        run: ./mvnw -B test -Dgroups=smoke,regression,auth

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            target/surefire-reports/
            target/allure-results/
            target/test-results/
          retention-days: 14

  prod-smoke:
    name: Production smoke (read-only, https://www.fomograb.com)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pom.xml') }}

      - name: Install Playwright browsers
        run: ./mvnw -B exec:java@install-browsers

      - name: Run production smoke checks
        run: ./mvnw -B test -Dgroups=prod-smoke -DexcludedGroups=

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-results
          path: |
            target/surefire-reports/
            target/allure-results/
            target/test-results/
          retention-days: 14
